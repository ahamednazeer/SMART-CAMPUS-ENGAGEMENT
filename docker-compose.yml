services:
  backend:
    image: ahamednazeer/smart-campus-engagement:backend-0.0.1
    restart: always
    environment:
      DATABASE_URL: "postgres://avnadmin:${AIVEN_PASSWORD}@pg-146a7365-blaze-303c.l.aivencloud.com:19777/defaultdb?sslmode=require"
      JWT_SECRET_KEY: "your-super-secret-key-change-in-production"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      APP_NAME: "Smart Campus Engagement"
      DEBUG: "true"
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: "llama-3.3-70b-versatile"
      OLLAMA_ENABLED: "false"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3.2:3b"
      UPLOAD_DIR: "uploads"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ahamednazeer/smart-campus-engagement:frontend-0.0.1
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
